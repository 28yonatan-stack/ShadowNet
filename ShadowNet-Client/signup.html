<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- הגדרות דף בסיסיות -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowNet - Sign Up</title>

    <!-- פונט Inter מבית Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- אייקונים מ-FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- מיתוג וסגנון עיצוב -->
    <link rel="icon" type="image/png" href="shadownet-shield-logo.png">
    <link rel="stylesheet" href="style.css?v=14">

    <!-- סקריפט אימות משותף -->
    <script src="validation.js?v=3"></script>
</head>
<body>

    <div class="app-card">

        <!-- חלק שמאלי: מיתוג ולוגו המגן -->
        <div class="brand-side">
            <div class="brand-content">
                <div class="logo-container">
                    <img src="shadownet-shield-logo.png" alt="ShadowNet Logo" class="brand-logo-img">
                </div>
                <p class="app-tagline">CREATE ACCOUNT &amp; VERIFY</p>
            </div>
        </div>

        <!-- חלק ימני: תהליך הרשמה ב-3 שלבים נקיים -->
        <div class="login-side">

            <div class="login-header">
                <h2 class="login-title">Create Account</h2>
                <p class="login-subtitle">Already have an account? <a href="login.html?v=shield" class="signup-link">Log in</a></p>
            </div>

            <!-- הודעת סטטוס (שגיאה או הצלחה) -->
            <div id="status-message" class="status-msg" style="display: none;"></div>

            <!-- שלב 1: הזנת כתובת אימייל בלבד ושליחת קוד אימות -->
            <form id="signup-form-step1" onsubmit="return handleInitialSignUp(event)" class="login-form">
                <div class="form-field">
                    <label for="signup-email" class="field-label">Email Address</label>
                    <input type="text" id="signup-email" class="field-input"
                           placeholder="name@company.com"
                           autocomplete="email"
                           oninput="liveValidateEmail()"
                           onblur="liveValidateEmail(true)">
                    <span class="field-error" id="email-error"></span>
                </div>
                <button type="submit" class="submit-btn" id="signup-submit-btn">Continue to Verification</button>
            </form>

            <!-- שלב 2: הזנת קוד האימות (OTP בן 6 ספרות) -->
            <form id="signup-form-step2" onsubmit="return handleVerifyRegisterOtp(event)" class="login-form" style="display: none;">
                <div class="otp-box">
                    <div class="otp-title">Email Verification</div>
                    <p class="otp-desc">
                        A 6-digit code was sent to:<br>
                        <span id="reg-target-email-display" class="otp-email-highlight">user@email.com</span>
                    </p>
                    <!-- שעון ספירה לאחור של 10 דקות -->
                    <div class="otp-timer-box" id="reg-otp-timer-box">
                        <i class="fa-regular fa-clock"></i> Code expires in: <span id="reg-otp-timer-countdown">10:00</span>
                    </div>
                    <!-- 6 קוביות להזנת הקוד -->
                    <div class="otp-boxes-container" id="reg-otp-boxes" dir="ltr">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="0" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="1" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="2" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="3" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="4" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="5" autocomplete="off">
                    </div>
                    <!-- פעולות חזרה ושליחה חוזרת -->
                    <div class="otp-actions">
                        <button type="button" class="back-step-btn" onclick="backToRegStep1()">← Back to email</button>
                        <button type="button" id="reg-resend-code-btn" class="resend-btn" onclick="resendRegisterOtpCode()">Resend Code</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="reg-otp-submit-btn">Verify Code</button>
            </form>

            <!-- שלב 3: מילוי שם מלא, שם משתמש, סיסמה ואישור סיסמה -->
            <form id="signup-form-step3" onsubmit="return handleCompleteRegistration(event)" class="login-form" style="display: none;">

                <!-- שדה שם מלא -->
                <div class="form-field">
                    <label for="full-name" class="field-label">Full Name</label>
                    <input type="text" id="full-name" class="field-input"
                           placeholder="John Doe"
                           autocomplete="name"
                           oninput="liveValidateFullName()"
                           onblur="liveValidateFullName(true)">
                    <span class="field-error" id="fullname-error"></span>
                </div>

                <!-- שדה שם משתמש -->
                <div class="form-field">
                    <label for="username" class="field-label">Username</label>
                    <input type="text" id="username" class="field-input"
                           placeholder="johndoe123"
                           autocomplete="username"
                           oninput="liveValidateUsername()"
                           onblur="liveValidateUsername(true)">
                    <span class="field-error" id="username-error"></span>
                </div>

                <!-- שדה סיסמה עם סרגל חוזק -->
                <div class="form-field">
                    <label for="signup-password" class="field-label">Password</label>
                    <div class="password-box">
                        <input type="password" id="signup-password" class="field-input"
                               placeholder="••••••••"
                               autocomplete="new-password"
                               oninput="liveValidatePassword()"
                               onblur="liveValidatePassword(true)">
                        <button type="button" class="eye-btn" id="signup-pass-eye"
                                onclick="toggleVisibility('signup-password','signup-pass-eye',event)"
                                title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <!-- סרגל חוזק הסיסמה -->
                    <div class="pass-strength-wrap" id="pass-strength-wrap" style="display:none;">
                        <div class="pass-strength-bar">
                            <div class="pass-strength-fill" id="pass-strength-fill"></div>
                        </div>
                        <span class="pass-hint" id="pass-hint"></span>
                    </div>
                    <span class="field-error" id="password-error"></span>
                </div>

                <!-- שדה אימות סיסמה חוזרת -->
                <div class="form-field">
                    <label for="signup-password-confirm" class="field-label">Confirm Password</label>
                    <div class="password-box">
                        <input type="password" id="signup-password-confirm" class="field-input"
                               placeholder="••••••••"
                               autocomplete="new-password"
                               oninput="liveValidateConfirmPassword()"
                               onblur="liveValidateConfirmPassword(true)">
                        <button type="button" class="eye-btn" id="signup-pass-confirm-eye"
                                onclick="toggleVisibility('signup-password-confirm','signup-pass-confirm-eye',event)"
                                title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="confirm-password-error"></span>
                </div>

                <!-- כפתור סיום יצירת החשבון -->
                <button type="submit" class="submit-btn" id="reg-complete-btn">Create Account</button>
            </form>

        </div>
    </div>

    <!-- לוגיקת JavaScript של דף ההרשמה -->
    <script>
        // כתובת שרת ה-API
        const API_BASE = (window.location.port === '5000') ? window.location.origin : 'http://localhost:5000';

        let pendingRegEmail = ''; // האימייל שנמצא בתהליך הרשמה
        let pendingRegCode  = ''; // הקוד שאומת בהצלחה

        // הצגת הודעת סטטוס
        function showMessage(text, isError) {
            const msgEl = document.getElementById('status-message');
            msgEl.innerText = text;
            msgEl.className = 'status-msg ' + (isError ? 'status-error' : 'status-success');
            msgEl.style.display = 'block';
        }

        // בדיקת תקינות אימייל בזמן אמת (שלב 1)
        function liveValidateEmail(force = false) {
            const el  = document.getElementById('signup-email');
            const err = document.getElementById('email-error');
            const val = el.value.trim();

            if (!val) {
                if (force) { setFieldError(el, err, 'Please enter your email address'); return false; }
                clearField(el, err); return true;
            }
            const check = isValidEmail(val);
            if (!check.ok) { setFieldError(el, err, check.msg); return false; }
            setFieldOk(el, err); return true;
        }

        // בדיקת תקינות שם מלא בזמן אמת (שלב 3)
        function liveValidateFullName(force = false) {
            const el  = document.getElementById('full-name');
            const err = document.getElementById('fullname-error');
            const val = el.value.trim();

            if (!val) {
                if (force) { setFieldError(el, err, 'Full name is required'); return false; }
                clearField(el, err); return true;
            }
            if (val.length < 2) { setFieldError(el, err, 'Name must be at least 2 characters'); return false; }
            setFieldOk(el, err); return true;
        }

        // בדיקת תקינות שם משתמש בזמן אמת (שלב 3)
        function liveValidateUsername(force = false) {
            const el  = document.getElementById('username');
            const err = document.getElementById('username-error');
            const val = el.value.trim();

            if (!val) {
                if (force) { setFieldError(el, err, 'Username is required'); return false; }
                clearField(el, err); return true;
            }
            if (val.length < 3) { setFieldError(el, err, 'Username must be at least 3 characters'); return false; }
            if (!/^[a-zA-Z0-9_.\-]+$/.test(val)) {
                setFieldError(el, err, 'Only letters, numbers, _ and . allowed'); return false;
            }
            setFieldOk(el, err); return true;
        }

        // בדיקת תקינות סיסמה ועדכון סרגל חוזק בזמן אמת (שלב 3)
        function liveValidatePassword(force = false) {
            const el   = document.getElementById('signup-password');
            const err  = document.getElementById('password-error');
            const wrap = document.getElementById('pass-strength-wrap');
            const fill = document.getElementById('pass-strength-fill');
            const hint = document.getElementById('pass-hint');
            const val  = el.value;

            if (!val) {
                wrap.style.display = 'none';
                if (force) { setFieldError(el, err, 'Password is required'); return false; }
                clearField(el, err); return true;
            }

            const check = validatePasswordRules(val);
            if (!check.ok) {
                wrap.style.display = 'none';
                setFieldError(el, err, check.msg);
                return false;
            }

            // עדכון סרגל חוזק
            wrap.style.display = 'block';
            fill.style.width      = (check.score / 5 * 100) + '%';
            fill.style.background = check.strength.color;
            hint.innerText        = check.strength.label;
            hint.style.color      = check.strength.color;

            setFieldOk(el, err);
            liveValidateConfirmPassword(); // עדכון שדה האימות אם הוקלד
            return true;
        }

        // בדיקת התאמת אישור סיסמה בזמן אמת (שלב 3)
        function liveValidateConfirmPassword(force = false) {
            const el      = document.getElementById('signup-password-confirm');
            const err     = document.getElementById('confirm-password-error');
            const passVal = document.getElementById('signup-password').value;
            const val     = el.value;

            if (!val) {
                if (force) { setFieldError(el, err, 'Please confirm your password'); return false; }
                clearField(el, err); return true;
            }
            if (val !== passVal) { setFieldError(el, err, 'Passwords do not match'); return false; }
            setFieldOk(el, err); return true;
        }

        // שלב 1: שליחת קוד אימות לאימייל
        async function handleInitialSignUp(event) {
            event.preventDefault();
            if (!liveValidateEmail(true)) return false;

            const email = document.getElementById('signup-email').value.trim();
            const btn   = document.getElementById('signup-submit-btn');
            btn.disabled = true;
            btn.innerText = 'Sending verification code...';

            try {
                const res  = await fetch(`${API_BASE}/api/auth/register-send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    pendingRegEmail = email;
                    document.getElementById('reg-target-email-display').innerText = email;
                    document.getElementById('signup-form-step1').style.display = 'none';
                    document.getElementById('signup-form-step2').style.display = 'block';
                    showMessage('✓ Verification code sent! Please enter the 6 digits.', false);
                    setupRegOtpBoxes('reg-otp-boxes', () => document.getElementById('reg-otp-submit-btn').focus());
                    startRegOtpCountdown();
                } else {
                    showMessage('✗ ' + (data.message || 'Registration error'), true);
                    btn.disabled = false;
                    btn.innerText = 'Continue to Verification';
                }
            } catch (err) {
                showMessage('✗ Server connection error: ' + err.message, true);
                btn.disabled = false;
                btn.innerText = 'Continue to Verification';
            }
            return false;
        }

        // ניהול טיימר ספירה לאחור של 10 דקות עבור קוד האימות
        let regOtpTimerSeconds  = 600;
        let regOtpTimerInterval = null;

        function startRegOtpCountdown() {
            if (regOtpTimerInterval) clearInterval(regOtpTimerInterval);
            regOtpTimerSeconds = 600;
            updateRegOtpTimerDisplay();
            const box = document.getElementById('reg-otp-timer-box');
            if (box) box.className = 'otp-timer-box';
            setRegOtpInputsDisabled(false);

            regOtpTimerInterval = setInterval(() => {
                regOtpTimerSeconds--;
                updateRegOtpTimerDisplay();
                if (regOtpTimerSeconds <= 60 && regOtpTimerSeconds > 0 && box)
                    box.classList.add('timer-warning');
                if (regOtpTimerSeconds <= 0) {
                    clearInterval(regOtpTimerInterval);
                    regOtpTimerInterval = null;
                    if (box) { box.classList.remove('timer-warning'); box.classList.add('timer-expired'); }
                    setRegOtpInputsDisabled(true);
                    showMessage('⚠️ Code expired. Please click "Resend Code".', true);
                }
            }, 1000);
        }

        function updateRegOtpTimerDisplay() {
            const el = document.getElementById('reg-otp-timer-countdown');
            if (!el) return;
            const m = Math.floor(Math.max(0, regOtpTimerSeconds) / 60);
            const s = Math.max(0, regOtpTimerSeconds) % 60;
            el.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function setRegOtpInputsDisabled(disabled) {
            document.querySelectorAll('#reg-otp-boxes .otp-box-digit').forEach(d => d.disabled = disabled);
            const btn = document.getElementById('reg-otp-submit-btn');
            if (btn) btn.disabled = disabled;
        }

        // אתחול 6 קוביות הקוד (מעבר אוטומטי, מחיקה והדבקה)
        function setupRegOtpBoxes(containerId, onComplete) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const inputs = container.querySelectorAll('.otp-box-digit');

            inputs.forEach((inp, i) => {
                inp.value = '';
                inp.classList.remove('filled');
                inp.disabled = false;

                inp.oninput = () => {
                    inp.value = inp.value.replace(/[^0-9]/g, '').slice(-1);
                    inp.classList.toggle('filled', !!inp.value);
                    if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
                    if (getRegEnteredOtp(containerId).length === 6 && onComplete) onComplete();
                };
                inp.onkeydown = (e) => {
                    if (e.key === 'Backspace') {
                        if (!inp.value && i > 0) { inputs[i-1].value = ''; inputs[i-1].classList.remove('filled'); inputs[i-1].focus(); }
                        else { inp.value = ''; inp.classList.remove('filled'); }
                    } else if (e.key === 'ArrowLeft'  && i > 0)                inputs[i-1].focus();
                      else if (e.key === 'ArrowRight' && i < inputs.length - 1) inputs[i+1].focus();
                };
                inp.onpaste = (e) => {
                    e.preventDefault();
                    const digits = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                    if (!digits) return;
                    inputs.forEach((box, idx) => {
                        box.value = idx < digits.length ? digits[idx] : '';
                        box.classList.toggle('filled', !!box.value);
                    });
                    inputs[Math.min(digits.length, inputs.length - 1)].focus();
                    if (getRegEnteredOtp(containerId).length === 6 && onComplete) onComplete();
                };
            });
            setTimeout(() => inputs[0].focus(), 100);
        }

        function getRegEnteredOtp(cid) {
            let code = '';
            document.querySelectorAll(`#${cid} .otp-box-digit`).forEach(i => code += i.value);
            return code;
        }

        // שלב 2: אימות קוד ה-OTP
        async function handleVerifyRegisterOtp(event) {
            event.preventDefault();
            const code = getRegEnteredOtp('reg-otp-boxes');
            const btn  = document.getElementById('reg-otp-submit-btn');

            if (code.length !== 6) { showMessage('Please enter all 6 digits', true); return false; }
            if (regOtpTimerSeconds <= 0) { showMessage('⚠️ Code expired. Click "Resend Code".', true); return false; }

            btn.disabled = true;
            btn.innerText = 'Verifying...';

            try {
                const res  = await fetch(`${API_BASE}/api/auth/verify-register-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingRegEmail, code })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    pendingRegCode = code;
                    if (regOtpTimerInterval) clearInterval(regOtpTimerInterval);
                    document.getElementById('signup-form-step2').style.display = 'none';
                    document.getElementById('signup-form-step3').style.display = 'block';
                    showMessage('✓ Email verified! Please fill in your account details.', false);
                    document.getElementById('full-name').focus();
                } else {
                    showMessage('✗ ' + (data.message || 'Incorrect or expired code'), true);
                    btn.disabled = false;
                    btn.innerText = 'Verify Code';
                }
            } catch (err) {
                showMessage('✗ Server error: ' + err.message, true);
                btn.disabled = false;
                btn.innerText = 'Verify Code';
            }
            return false;
        }

        // שלב 3: סיום ההרשמה ושמירת המשתמש
        async function handleCompleteRegistration(event) {
            event.preventDefault();

            const fnOk  = liveValidateFullName(true);
            const unOk  = liveValidateUsername(true);
            const pwOk  = liveValidatePassword(true);
            const cpOk  = liveValidateConfirmPassword(true);
            if (!fnOk || !unOk || !pwOk || !cpOk) {
                showMessage('Please fix the errors highlighted above', true);
                return false;
            }

            const btn = document.getElementById('reg-complete-btn');
            btn.disabled = true;
            btn.innerText = 'Creating account...';

            try {
                const res  = await fetch(`${API_BASE}/api/auth/register-complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email:    pendingRegEmail,
                        code:     pendingRegCode,
                        fullName: document.getElementById('full-name').value.trim(),
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('signup-password').value
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showMessage('✓ Account created successfully!', false);
                    setTimeout(() => {
                        window.location.href = 'login.html?registered=true&email=' + encodeURIComponent(pendingRegEmail);
                    }, 1200);
                } else {
                    showMessage('✗ ' + (data.message || 'Account creation failed'), true);
                    btn.disabled = false;
                    btn.innerText = 'Create Account';
                }
            } catch (err) {
                showMessage('✗ Server error: ' + err.message, true);
                btn.disabled = false;
                btn.innerText = 'Create Account';
            }
            return false;
        }

        // חזרה לשלב 1 (שינוי אימייל)
        function backToRegStep1() {
            if (regOtpTimerInterval) clearInterval(regOtpTimerInterval);
            document.getElementById('signup-form-step2').style.display = 'none';
            document.getElementById('signup-form-step1').style.display = 'block';
            const btn = document.getElementById('signup-submit-btn');
            btn.disabled = false;
            btn.innerText = 'Continue to Verification';
            document.getElementById('status-message').style.display = 'none';
        }

        // שליחת קוד חוזרת
        async function resendRegisterOtpCode() {
            const btn = document.getElementById('reg-resend-code-btn');
            btn.disabled = true;
            btn.innerText = 'Sending...';
            try {
                const res  = await fetch(`${API_BASE}/api/auth/resend-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingRegEmail, purpose: 'register' })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showMessage('✓ New verification code sent successfully!', false);
                    setupRegOtpBoxes('reg-otp-boxes');
                    startRegOtpCountdown();
                } else {
                    showMessage('✗ ' + (data.message || 'Failed to resend code'), true);
                }
            } catch (err) {
                showMessage('✗ Connection error: ' + err.message, true);
            }
            setTimeout(() => { btn.disabled = false; btn.innerText = 'Resend Code'; }, 5000);
        }
    </script>

</body>
</html>
