<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- הגדרות דף בסיסיות -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowNet - Reset Password</title>

    <!-- פונט Inter מבית Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- אייקונים מ-FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- סגנון עיצוב ואייקון -->
    <link rel="icon" type="image/png" href="shadownet-shield-logo.png">
    <link rel="stylesheet" href="style.css?v=14">

    <!-- סקריפט אימות משותף -->
    <script src="validation.js?v=3"></script>
</head>
<body>

    <div class="app-card">

        <!-- חלק שמאלי: מיתוג ולוגו המגן -->
        <div class="brand-side">
            <div class="brand-content">
                <div class="logo-container">
                    <img src="shadownet-shield-logo.png" alt="ShadowNet Logo" class="brand-logo-img">
                </div>
                <p class="app-tagline">CYBER SECURITY &amp; VERIFICATION</p>
            </div>
        </div>

        <!-- חלק ימני: טופס איפוס סיסמה ב-3 שלבים -->
        <div class="login-side">

            <div class="login-header">
                <h2 class="login-title">Reset Password</h2>
                <p class="login-subtitle" id="reset-subtitle">Enter your email to receive a verification code</p>
            </div>

            <!-- הודעת סטטוס (שגיאה או הצלחה) -->
            <div id="status-message" class="status-msg" style="display: none;"></div>

            <!-- שלב 1: הזנת כתובת אימייל ושליחת קוד איפוס -->
            <form id="reset-form-step1" onsubmit="return handleSendResetCode(event)" class="login-form">

                <div class="form-field">
                    <label for="reset-email" class="field-label">Email Address</label>
                    <input type="text" id="reset-email" class="field-input"
                           placeholder="name@company.com"
                           autocomplete="email"
                           oninput="liveValidateResetEmail()"
                           onblur="liveValidateResetEmail(true)">
                    <span class="field-error" id="reset-email-error"></span>
                </div>

                <button type="submit" class="submit-btn" id="send-code-btn">Send Verification Code</button>

                <div class="back-to-login-box">
                    <a href="login.html" class="back-link">Back to Login</a>
                </div>
            </form>

            <!-- שלב 2: הזנת קוד האימות בן 6 ספרות -->
            <form id="reset-form-step2" onsubmit="return handleVerifyResetCode(event)" class="login-form" style="display: none;">

                <div class="otp-box">
                    <p class="otp-desc">
                        A 6-digit code was sent to <strong id="reset-target-email-display" class="otp-email-highlight">user@email.com</strong>
                    </p>

                    <!-- שעון ספירה לאחור של 10 דקות -->
                    <div class="otp-timer-box" id="reset-otp-timer-box">
                        <i class="fa-regular fa-clock"></i> Code expires in: <span id="reset-otp-timer-countdown">10:00</span>
                    </div>

                    <!-- 6 קוביות להזנת הקוד -->
                    <div class="otp-boxes-container" id="reset-otp-boxes" dir="ltr">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="0" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="1" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="2" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="3" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="4" autocomplete="off">
                        <input type="text" class="otp-box-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="5" autocomplete="off">
                    </div>

                    <!-- פעולות חזרה ושליחה חוזרת -->
                    <div class="otp-actions">
                        <button type="button" class="back-step-btn" onclick="backToResetStep1()">← Change email</button>
                        <button type="button" id="reset-resend-code-btn" class="resend-btn" onclick="resendResetOtpCode()">Resend code</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="reset-otp-submit-btn">Verify Code</button>
            </form>

            <!-- שלב 3: הזנת סיסמה חדשה ואישורה -->
            <form id="reset-form-step3" onsubmit="return handleSetNewPassword(event)" class="login-form" style="display: none;">

                <!-- שדה סיסמה חדשה עם סרגל חוזק -->
                <div class="form-field">
                    <label for="new-password" class="field-label">New Password</label>
                    <div class="password-box">
                        <input type="password" id="new-password" class="field-input"
                               placeholder="••••••••"
                               autocomplete="new-password"
                               oninput="liveValidateNewPassword()"
                               onblur="liveValidateNewPassword(true)">
                        <button type="button" class="eye-btn" id="new-password-eye" onclick="toggleVisibility('new-password', 'new-password-eye', event)" title="Show/Hide password" aria-label="Toggle password visibility">
                            <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <!-- סרגל חוזק -->
                    <div class="pass-strength-wrap" id="pass-strength-wrap" style="display:none;">
                        <div class="pass-strength-bar">
                            <div class="pass-strength-fill" id="pass-strength-fill"></div>
                        </div>
                        <span class="pass-hint" id="pass-hint"></span>
                    </div>
                    <span class="field-error" id="new-password-error"></span>
                </div>

                <!-- שדה אישור סיסמה חדשה -->
                <div class="form-field">
                    <label for="confirm-password" class="field-label">Confirm New Password</label>
                    <div class="password-box">
                        <input type="password" id="confirm-password" class="field-input"
                               placeholder="••••••••"
                               autocomplete="new-password"
                               oninput="liveValidateConfirmPassword()"
                               onblur="liveValidateConfirmPassword(true)">
                        <button type="button" class="eye-btn" id="confirm-password-eye" onclick="toggleVisibility('confirm-password', 'confirm-password-eye', event)" title="Show/Hide password" aria-label="Toggle password visibility">
                            <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="confirm-password-error"></span>
                </div>

                <!-- כפתור שמירת סיסמה חדשה וכניסה -->
                <button type="submit" class="submit-btn" id="reset-submit-btn">Update Password &amp; Login</button>

                <div class="back-to-login-box">
                    <a href="login.html" class="back-link">Back to Login</a>
                </div>
            </form>

        </div>

    </div>

    <!-- לוגיקת JavaScript של דף איפוס הסיסמה -->
    <script>
        // כתובת השרת
        const API_BASE = (window.location.port === '5000') ? window.location.origin : 'http://localhost:5000';

        let pendingResetEmail = ""; // האימייל שעבורו מאפסים
        let verifiedResetCode = ""; // הקוד שאומת

        // הצגת הודעת סטטוס
        function showMessage(text, isError = false) {
            const msgEl = document.getElementById("status-message");
            if (msgEl) {
                msgEl.innerText = text;
                msgEl.className = "status-msg " + (isError ? "status-error" : "status-success");
                msgEl.style.display = "block";
            }
        }

        // בדיקת תקינות אימייל בזמן אמת (שלב 1)
        function liveValidateResetEmail(force = false) {
            const el = document.getElementById("reset-email");
            const err = document.getElementById("reset-email-error");
            const val = el.value.trim();

            if (!val) {
                if (force) { setFieldError(el, err, "Please enter your email address"); return false; }
                clearField(el, err); return true;
            }

            const check = isValidEmail(val);
            if (!check.ok) {
                setFieldError(el, err, check.msg);
                return false;
            }
            setFieldOk(el, err);
            return true;
        }

        // בדיקת תקינות סיסמה חדשה בזמן אמת (שלב 3)
        function liveValidateNewPassword(force = false) {
            const el = document.getElementById("new-password");
            const err = document.getElementById("new-password-error");
            const wrap = document.getElementById("pass-strength-wrap");
            const fill = document.getElementById("pass-strength-fill");
            const hint = document.getElementById("pass-hint");
            const val = el.value;

            if (!val) {
                wrap.style.display = 'none';
                if (force) { setFieldError(el, err, "Password is required"); return false; }
                clearField(el, err); return true;
            }

            const check = validatePasswordRules(val);
            if (!check.ok) {
                wrap.style.display = 'none';
                setFieldError(el, err, check.msg);
                return false;
            }

            // עדכון סרגל חוזק
            wrap.style.display = 'block';
            fill.style.width = (check.score / 5 * 100) + '%';
            fill.style.background = check.strength.color;
            hint.innerText = check.strength.label;
            hint.style.color = check.strength.color;

            setFieldOk(el, err);
            liveValidateConfirmPassword();
            return true;
        }

        // בדיקת התאמת אישור סיסמה חדשה (שלב 3)
        function liveValidateConfirmPassword(force = false) {
            const el = document.getElementById("confirm-password");
            const err = document.getElementById("confirm-password-error");
            const passVal = document.getElementById("new-password").value;
            const val = el.value;

            if (!val) {
                if (force) { setFieldError(el, err, "Please confirm your password"); return false; }
                clearField(el, err); return true;
            }
            if (val !== passVal) {
                setFieldError(el, err, "Passwords do not match");
                return false;
            }
            setFieldOk(el, err);
            return true;
        }

        // שלב 1: שליחת קוד אימות לאיפוס סיסמה
        async function handleSendResetCode(event) {
            event.preventDefault();

            if (!liveValidateResetEmail(true)) {
                return false;
            }

            const email = document.getElementById("reset-email").value.trim();
            const btn = document.getElementById("send-code-btn");

            btn.disabled = true;
            btn.innerText = "Sending code...";

            try {
                const response = await fetch(`${API_BASE}/api/auth/reset-send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    pendingResetEmail = email;
                    document.getElementById("reset-target-email-display").innerText = email;
                    document.getElementById("reset-form-step1").style.display = "none";
                    document.getElementById("reset-form-step2").style.display = "block";
                    document.getElementById("reset-subtitle").innerText = "Enter the 6-digit code sent to your email";
                    showMessage("✓ Verification code sent! Check your email inbox.", false);

                    setupResetOtpBoxes("reset-otp-boxes", () => {
                        document.getElementById("reset-otp-submit-btn").focus();
                    });
                    startResetOtpCountdown();
                } else {
                    showMessage("✗ " + (data.message || "Error sending verification code."), true);
                    btn.disabled = false;
                    btn.innerText = "Send Verification Code";
                }
            } catch (err) {
                console.error(err);
                showMessage("✗ Connection error: " + err.message, true);
                btn.disabled = false;
                btn.innerText = "Send Verification Code";
            }

            return false;
        }

        // שלב 2: אימות קוד האיפוס בלבד
        async function handleVerifyResetCode(event) {
            event.preventDefault();

            const code = getResetEnteredOtp("reset-otp-boxes");
            const btn = document.getElementById("reset-otp-submit-btn");

            if (!code || code.length !== 6) {
                showMessage("Please enter all 6 digits.", true);
                return false;
            }

            btn.disabled = true;
            btn.innerText = "Verifying code...";

            try {
                const response = await fetch(`${API_BASE}/api/auth/verify-reset-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingResetEmail, code: code })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    verifiedResetCode = code;
                    if (resetOtpTimerInterval) clearInterval(resetOtpTimerInterval);

                    document.getElementById("reset-form-step2").style.display = "none";
                    document.getElementById("reset-form-step3").style.display = "block";
                    document.getElementById("reset-subtitle").innerText = "Create your new password below";
                    showMessage("✓ Code verified successfully! Now choose your new password.", false);
                    setTimeout(() => document.getElementById("new-password").focus(), 100);
                } else {
                    showMessage("✗ " + (data.message || "Invalid or expired code. Please try again."), true);
                    btn.disabled = false;
                    btn.innerText = "Verify Code";
                }
            } catch (err) {
                console.error(err);
                showMessage("✗ Connection error: " + err.message, true);
                btn.disabled = false;
                btn.innerText = "Verify Code";
            }

            return false;
        }

        // שלב 3: שמירת סיסמה חדשה במסד הנתונים
        async function handleSetNewPassword(event) {
            event.preventDefault();

            const passOk = liveValidateNewPassword(true);
            const confirmOk = liveValidateConfirmPassword(true);
            if (!passOk || !confirmOk) {
                showMessage("Please fix the highlighted errors above.", true);
                return false;
            }

            const pass = document.getElementById("new-password").value;
            const btn = document.getElementById("reset-submit-btn");

            btn.disabled = true;
            btn.innerText = "Updating password...";

            try {
                const response = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: pendingResetEmail,
                        code: verifiedResetCode,
                        newPassword: pass
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage("✓ Password updated successfully! Redirecting to login...", false);
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1400);
                } else {
                    showMessage("✗ " + (data.message || "Error updating password."), true);
                    btn.disabled = false;
                    btn.innerText = "Update Password & Login";
                }
            } catch (err) {
                console.error(err);
                showMessage("✗ Connection error: " + err.message, true);
                btn.disabled = false;
                btn.innerText = "Update Password & Login";
            }

            return false;
        }

        // ניהול טיימר ספירה לאחור של 10 דקות עבור קוד האיפוס
        let resetOtpTimerSeconds = 600;
        let resetOtpTimerInterval = null;

        function startResetOtpCountdown() {
            if (resetOtpTimerInterval) clearInterval(resetOtpTimerInterval);
            resetOtpTimerSeconds = 600;
            updateResetOtpTimerDisplay();

            const timerBox = document.getElementById("reset-otp-timer-box");
            if (timerBox) timerBox.className = "otp-timer-box";
            setResetOtpInputsDisabled(false);

            resetOtpTimerInterval = setInterval(() => {
                resetOtpTimerSeconds--;
                updateResetOtpTimerDisplay();

                if (resetOtpTimerSeconds <= 60 && resetOtpTimerSeconds > 0 && timerBox) {
                    timerBox.classList.add("timer-warning");
                }

                if (resetOtpTimerSeconds <= 0) {
                    clearInterval(resetOtpTimerInterval);
                    resetOtpTimerInterval = null;
                    if (timerBox) {
                        timerBox.classList.remove("timer-warning");
                        timerBox.classList.add("timer-expired");
                    }
                    setResetOtpInputsDisabled(true);
                    showMessage("⚠️ Verification code expired. Please click 'Resend code'.", true);
                }
            }, 1000);
        }

        function updateResetOtpTimerDisplay() {
            const countdownEl = document.getElementById("reset-otp-timer-countdown");
            if (!countdownEl) return;
            const mins = Math.floor(Math.max(0, resetOtpTimerSeconds) / 60);
            const secs = Math.max(0, resetOtpTimerSeconds) % 60;
            countdownEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function setResetOtpInputsDisabled(disabled) {
            const digits = document.querySelectorAll("#reset-otp-boxes .otp-box-digit");
            digits.forEach(d => d.disabled = disabled);
            const btn = document.getElementById("reset-otp-submit-btn");
            if (btn) btn.disabled = disabled;
        }

        // אתחול 6 קוביות הקוד
        function setupResetOtpBoxes(containerId, onCompleteCallback) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const inputs = container.querySelectorAll(".otp-box-digit");

            inputs.forEach((input, index) => {
                input.value = "";
                input.classList.remove("filled");
                input.disabled = false;

                input.oninput = () => {
                    const val = input.value.replace(/[^0-9]/g, "");
                    input.value = val ? val[val.length - 1] : "";
                    if (input.value) {
                        input.classList.add("filled");
                        if (index < inputs.length - 1) inputs[index + 1].focus();
                    } else {
                        input.classList.remove("filled");
                    }
                    const fullCode = getResetEnteredOtp(containerId);
                    if (fullCode.length === 6 && onCompleteCallback) onCompleteCallback(fullCode);
                };

                input.onkeydown = (e) => {
                    if (e.key === "Backspace") {
                        if (!input.value && index > 0) {
                            inputs[index - 1].value = "";
                            inputs[index - 1].classList.remove("filled");
                            inputs[index - 1].focus();
                        } else {
                            input.value = "";
                            input.classList.remove("filled");
                        }
                    } else if (e.key === "ArrowLeft" && index > 0) {
                        inputs[index - 1].focus();
                    } else if (e.key === "ArrowRight" && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                };

                input.onpaste = (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "");
                    if (pasteData) {
                        inputs.forEach((box, idx) => {
                            box.value = idx < pasteData.length ? pasteData[idx] : "";
                            box.classList.toggle("filled", !!box.value);
                        });
                        const nextFocus = Math.min(pasteData.length, inputs.length - 1);
                        inputs[nextFocus].focus();
                        const fullCode = getResetEnteredOtp(containerId);
                        if (fullCode.length === 6 && onCompleteCallback) onCompleteCallback(fullCode);
                    }
                };
            });

            setTimeout(() => inputs[0].focus(), 100);
        }

        function getResetEnteredOtp(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return "";
            let code = "";
            container.querySelectorAll(".otp-box-digit").forEach(inp => code += inp.value);
            return code;
        }

        // חזרה לשלב 1 (הזנת אימייל)
        function backToResetStep1() {
            if (resetOtpTimerInterval) clearInterval(resetOtpTimerInterval);
            document.getElementById("reset-form-step2").style.display = "none";
            document.getElementById("reset-form-step1").style.display = "block";
            document.getElementById("reset-subtitle").innerText = "Enter your email to receive a verification code";
            const btn = document.getElementById("send-code-btn");
            btn.disabled = false;
            btn.innerText = "Send Verification Code";
            const msgEl = document.getElementById("status-message");
            if (msgEl) msgEl.style.display = "none";
        }

        // שליחת קוד חוזרת
        async function resendResetOtpCode() {
            const resendBtn = document.getElementById("reset-resend-code-btn");
            resendBtn.disabled = true;
            resendBtn.innerText = "Sending...";

            try {
                const response = await fetch(`${API_BASE}/api/auth/resend-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingResetEmail, purpose: 'reset' })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    showMessage("✓ A new verification code was sent to your email!", false);
                    startResetOtpCountdown();
                    setupResetOtpBoxes("reset-otp-boxes");
                } else {
                    showMessage("✗ " + (data.message || "Error resending code."), true);
                }
            } catch (err) {
                showMessage("✗ Connection error: " + err.message, true);
            }

            setTimeout(() => {
                resendBtn.disabled = false;
                resendBtn.innerText = "Resend code";
            }, 5000);
        }
    </script>

</body>
</html>
